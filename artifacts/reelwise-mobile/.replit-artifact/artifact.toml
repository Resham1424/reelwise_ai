kind = "mobile"
previewPath = "/mobile/"
title = "Reelwise"
description = "A premium short-form technology recommendation app that learns from reel interactions, infers latent interests, explains recommendations, and filters out low-value hype with HypeShield."
version = "1.0.0"
id = "artifacts/reelwise-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 20930

[services.development]
run = "pnpm --filter @workspace/reelwise-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reelwise-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/reelwise-mobile", "run", "serve" ]

[services.env]
PORT = "20930"
BASE_PATH = "/mobile/"
